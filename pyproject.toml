[project]
name = "momo-charts"
version = "0.1.0"
description = "Self-hosted, TradingView-style stock charts and screener, on your own Schwab data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alex Kaplewicz" }]
keywords = [
  "stock-charts", "trading", "swing-trading", "momentum", "stock-screener", "watchlist",
  "tradingview-alternative", "canvas-charts", "schwab-api", "self-hosted", "fastapi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: JavaScript",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
  "uvicorn>=0.32,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.urls]
Homepage = "https://github.com/alx-kap/momo-charts"
Repository = "https://github.com/alx-kap/momo-charts"
Issues = "https://github.com/alx-kap/momo-charts/issues"

[project.scripts]
momo = "momo_scan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momo_scan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/momo_scan/models.py" = ["E741"]
